# ==============================================================================
# Media Fuel Solutions website, behind the shared Traefik proxy
# ==============================================================================
# Needs a running Traefik with:
#   - the external "traefik-public" network
#   - a "websecure" entrypoint on :443 (and :80 redirecting to it)
#   - a "letsencrypt" certificate resolver
# (the same setup as frappe-route-trading/traefik)
#
# Deploy / update:
#   git pull && docker compose up -d --build
# ==============================================================================

name: media-fuel-solutions

services:
  web:
    build: .
    image: media-fuel-solutions:latest
    container_name: mediafuel-web
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.services.mediafuel.loadbalancer.server.port=3000"

      # Main site: https://mediafuelsolutions.com
      - "traefik.http.routers.mediafuel.rule=Host(`mediafuelsolutions.com`)"
      - "traefik.http.routers.mediafuel.entrypoints=websecure"
      - "traefik.http.routers.mediafuel.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mediafuel.service=mediafuel"
      - "traefik.http.routers.mediafuel.middlewares=mediafuel-headers,mediafuel-compress"

      # www.mediafuelsolutions.com -> mediafuelsolutions.com (permanent redirect)
      - "traefik.http.routers.mediafuel-www.rule=Host(`www.mediafuelsolutions.com`)"
      - "traefik.http.routers.mediafuel-www.entrypoints=websecure"
      - "traefik.http.routers.mediafuel-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.mediafuel-www.service=mediafuel"
      - "traefik.http.routers.mediafuel-www.middlewares=mediafuel-www-redirect"
      - "traefik.http.middlewares.mediafuel-www-redirect.redirectregex.regex=^https?://www\\.mediafuelsolutions\\.com(:[0-9]+)?/(.*)"
      - "traefik.http.middlewares.mediafuel-www-redirect.redirectregex.replacement=https://mediafuelsolutions.com/$${2}"
      - "traefik.http.middlewares.mediafuel-www-redirect.redirectregex.permanent=true"

      # Security headers and compression (defined here so this works on any Traefik)
      - "traefik.http.middlewares.mediafuel-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.mediafuel-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.mediafuel-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.mediafuel-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.mediafuel-compress.compress=true"

networks:
  traefik-public:
    external: true
